name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npx next build
        env:
          # 빌드는 DB·외부 API 없이 통과해야 한다
          SESSION_SECRET: ci-only-secret
